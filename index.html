<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet" 
      type="text/css"
    >
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
  </head>
  <body>
    <header class="banner">
      <img class="banner__image" src="./eisenhower-matrix.jpg" alt="eisenhower matrix todolist">
      <a 
        class="banner__link" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </header>
    <main class="main-content">
      <section class="add-task" id="addTaskSection">
        <h3 class="main-content__title">Add Item</h3>
        <div class="add-task__form">
          <input id="new-task"class="add-task__input task-input" type="text">
          <button class="add-task__button task-button">Add</button>
        </div>
      </section>
      <h3 class="main-content__title">Todo</h3>
      <ul class="tasks tasks-incomplete" id="incompleteTasks">
        <li class="task-item">
          <input class="task-item__checkbox" type="checkbox">
          <label class="task-item__label">Pay Bills</label>
          <input type="text" class="task-item__input task-input">
          <button class="task-button task-item__button_edit">Edit</button>
          <button class="task-button task-item__button_delete">
            <img class="task-item__icon" src="./remove.svg" alt="">
          </button>
        </li>
        <li class="task-item edit-mode">
          <input class="task-item__checkbox" type="checkbox">
          <label class="task-item__label">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task-item__input task-input">
          <button class="task-button task-item__button_edit">Save</button>
          <button class="task-button task-item__button_delete">
            <img class="task-item__icon" src="./remove.svg" alt="">
          </button>
        </li>
      </ul>
      <h3 class="main-content__title">Completed</h3>
      <ul class="tasks tasks-completed" id="completed-tasks">
        <li class="task-item">
          <input class="task-item__checkbox" type="checkbox" checked>
          <label class="task-item__label">See the Doctor</label>
          <input type="text" class="task-item__input task-input">
          <button class="task-button task-item__button_edit">Edit</button>
          <button class="task-button task-item__button_delete">
            <img class="task-item__icon" src="./remove.svg" alt="">
          </button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
